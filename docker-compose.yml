services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ITEA3express
      MYSQL_USER: ITEA3express
      MYSQL_PASSWORD: ITEA3_express
      MYSQL_ROOT_PASSWORD: Rupp.oudom.2006
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRupp.oudom.2006"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:80"
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api_storage:/var/www/html/storage

  web:
    build:
      context: ./frontend
      args:
        # Must be the URL the *browser* can reach — for local dev that's the
        # host machine's mapped api port, not an internal container hostname.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_REVERB_APP_KEY: 57db02062228a6f7503a78b7516182c3
        NEXT_PUBLIC_REVERB_HOST: localhost
        NEXT_PUBLIC_REVERB_PORT: 8080
        NEXT_PUBLIC_REVERB_SCHEME: http
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
  api_storage:
